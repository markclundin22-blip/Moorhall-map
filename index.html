const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = 'mhc-map-key-' + P.salt.slice(0, 8);
async function decryptWith(key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(P.iv) }, key, ub(P.data));
  return new TextDecoder().decode(pt);
}
function show(html) { document.open(); document.write(html); document.close(); }
async function fromPassword(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub(P.salt), iterations: P.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
(async () => {
  if (!window.crypto || !crypto.subtle) { document.getElementById('err').textContent = 'This browser can\'t open encrypted pages. Open the link in Safari or Chrome.'; return; }
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const key = await crypto.subtle.importKey('raw', ub(saved), 'AES-GCM', false, ['decrypt']);
      show(await decryptWith(key)); return;
    }
  } catch (e) { try { localStorage.removeItem(KEY); } catch (x) {} }
})();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Opening…'; err.textContent = '';
  try {
    const key = await fromPassword(document.getElementById('pw').value.trim().toLowerCase());
    const html = await decryptWith(key);
    if (document.getElementById('rem').checked) {
      try { const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key)); localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (x) {}
    }
    show(html);
  } catch (x) {
    btn.disabled = false; btn.textContent = 'Open the map';
    err.textContent = 'That password didn\'t work. Check it and try again.';
    document.getElementById('pw').select();
  }
});
